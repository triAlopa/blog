<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证码</title>
    <style type="text/css">
        /* 全局重置 & 基础 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .qmbox {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .qmbox table {
            border-collapse: collapse;
            width: 100%;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        .qmbox h1, .qmbox h2, .qmbox h3 {
            color: #1a2b3c;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        .qmbox p {
            margin: 0 0 12px 0;
            padding: 0;
            color: #2c3e50;
            font-size: 15px;
            line-height: 1.6;
        }
        .qmbox hr {
            background-color: #e9edf2;
            border: none;
            height: 1px;
            margin: 20px 0 16px 0;
        }
        .qmbox .eo-link {
            color: #2a7de1;
            text-decoration: none;
            font-weight: 500;
        }
        .qmbox .eo-link:hover {
            color: #1a5bbf;
            text-decoration: underline;
        }
        .qmbox .p-intro {
            padding: 28px 32px 12px 32px;
        }
        .qmbox .p-code {
            padding: 8px 32px 20px 32px;
        }
        .qmbox .p-footer {
            padding: 4px 32px 28px 32px;
        }

        /* 头部 */
        .header-td {
            background-color: #f8fafc;
            border-bottom: 1px solid #edf2f7;
            padding: 16px 32px;
            display: flex;
            align-items: center;
        }
        .header-td img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            margin-right: 12px;
            vertical-align: middle;
        }
        .header-td .site-name {
            font-size: 20px;
            font-weight: 600;
            color: #1a2b3c;
            letter-spacing: -0.3px;
            vertical-align: middle;
        }

        /* 验证码卡片 */
        .code-wrapper {
            display: inline-block;
            background: #f2f6fc;
            border-radius: 12px;
            border: 1px solid #dce4ec;
            padding: 6px 10px 6px 20px;
            min-width: 200px;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
            transition: all 0.1s ease;
        }
        .code-wrapper .code-text {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #0b1e2e;
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
            background: transparent;
            border: none;
            padding: 8px 45px 8px 8px;
            display: inline-block;
            text-align: center;
            min-width: 160px;
        }
        .copy-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #2a7de1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            line-height: 32px;
            text-align: center;
            padding: 0;
            transition: background 0.15s ease, transform 0.1s ease;
            box-shadow: 0 2px 6px rgba(42, 125, 225, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .copy-btn:hover {
            background: #1a5bbf;
            transform: translateY(-50%) scale(1.03);
        }
        .copy-btn:active {
            background: #124a9e;
            transform: translateY(-50%) scale(0.96);
        }

        /* 辅助文字 */
        .helper-note {
            font-size: 13px;
            color: #5e6f8d;
            margin-top: 6px;
            background: #f8faff;
            padding: 10px 16px;
            border-radius: 10px;
            border-left: 3px solid #2a7de1;
        }

        /* 底部链接 */
        .footer-link {
            color: #2a7de1;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link:hover {
            text-decoration: underline;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .qmbox .p-intro, .qmbox .p-code, .qmbox .p-footer {
                padding-left: 20px;
                padding-right: 20px;
            }
            .header-td {
                padding: 14px 20px;
                flex-wrap: wrap;
            }
            .code-wrapper {
                min-width: 140px;
                padding: 6px 8px 6px 12px;
            }
            .code-wrapper .code-text {
                font-size: 26px;
                letter-spacing: 4px;
                min-width: 120px;
                padding-right: 40px;
            }
            .copy-btn {
                width: 28px;
                height: 28px;
                font-size: 11px;
                line-height: 28px;
                right: 6px;
            }
        }
    </style>
</head>
<body>
<div class="qmbox">
    <table cellpadding="0" cellspacing="0" role="presentation">
        <!-- 头部 -->
        <tr>
            <td class="header-td" style="background:#f8fafc; border-bottom:1px solid #edf2f7; padding:16px 32px;">
                <img src="${logoUrl}" alt="logo" style="width:44px;height:44px;border-radius:8px;margin-right:12px;vertical-align:middle;" />
                <span class="site-name" style="font-size:20px;font-weight:600;color:#1a2b3c;vertical-align:middle;">${siteName}</span>
            </td>
        </tr>

        <!-- 主体内容 -->
        <tr>
            <td class="p-intro">
                <h1 style="font-size: 26px; font-weight: 700; margin-bottom: 10px; color: #0b1e2e;">验证您的邮箱</h1>
                <p style="font-size: 15px; color: #2c3e50;">感谢您使用 <strong style="color:#1a2b3c;">${siteName}</strong>。</p>
                <p style="font-size: 15px; color: #2c3e50; margin-bottom: 4px;">请在登录或注册页面输入以下验证码，以完成邮箱验证：</p>
            </td>
        </tr>

        <!-- 验证码区域 (优化复制交互) -->
        <tr>
            <td class="p-code">
                <div class="code-wrapper">
                    <span id="verifyCode" class="code-text">${code}</span>

                </div>
                <div class="helper-note">
                    ⏱️ 验证码有效期为 10 分钟，请勿将验证码告知他人。
                </div>
            </td>
        </tr>

        <!-- 提示信息 -->
        <tr>
            <td class="p-intro" style="padding-top: 4px;">
                <p style="font-size: 14px; color: #4a5a72; background: #f8faff; padding: 12px 16px; border-radius: 10px; border-left: 3px solid #b0c9e8;">
                    🔒 这封邮件包含您的私密信息，请勿回复或转发，以避免信息泄露风险。
                </p>
            </td>
        </tr>

        <!-- 底部 -->
        <tr>
            <td class="p-footer">
                <hr style="background:#e9edf2;border:none;height:1px;margin:12px 0 16px 0;">
                <p style="text-align: center; font-size: 14px; color: #5e6f8d; margin: 0;">
                    ${siteName} · <a href='${siteUrl}' class="footer-link" style="color:#2a7de1;text-decoration:none;font-weight:500;">${siteName}</a>
                </p>
                <p style="text-align: center; font-size: 12px; color: #8a9bb0; margin-top: 6px;">
                    此邮件由系统自动发送，请勿直接回复。
                </p>
            </td>
        </tr>
    </table>
</div>

<script>
    (function() {
        // 增强复制功能：兼容多浏览器 + 优雅提示
        function copyCode() {
            const codeElement = document.getElementById('verifyCode');
            if (!codeElement) return;

            // 获取纯文本内容 (去除可能的内联样式或多余空格)
            let code = codeElement.innerText.trim();

            // 使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(() => {
                    showToast('✅ 验证码已复制: ' + code);
                }).catch(() => {
                    fallbackCopy(code);
                });
            } else {
                fallbackCopy(code);
            }
        }

        // 降级方案 (textarea)
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const success = document.execCommand('copy');
                if (success) {
                    showToast('✅ 验证码已复制: ' + text);
                } else {
                    showToast('❌ 复制失败，请手动复制');
                }
            } catch (err) {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        // 轻提示 (代替 alert)
        function showToast(message) {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.textContent = message;
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '30px',
                left: '50%',
                transform: 'translateX(-50%)',
                background: '#1a2b3c',
                color: '#ffffff',
                padding: '12px 28px',
                borderRadius: '40px',
                fontSize: '15px',
                fontWeight: '500',
                boxShadow: '0 8px 28px rgba(0,0,0,0.18)',
                zIndex: '9999',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                letterSpacing: '0.3px',
                maxWidth: '90%',
                textAlign: 'center',
                opacity: '0',
                transition: 'opacity 0.2s ease, transform 0.2s ease',
                border: '1px solid rgba(255,255,255,0.08)'
            });
            document.body.appendChild(toast);

            // 触发淡入
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(-50%) translateY(0)';
            });

            // 3.5s 后自动移除
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(8px)';
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 250);
            }, 2800);
        }

        // 将 copyCode 暴露到全局 (供 onclick 调用)
        window.copyCode = copyCode;
    })();
</script>
</body>
</html>
